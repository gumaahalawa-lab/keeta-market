<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Keeta Market</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root{--pi:#6c35de;--pi-dark:#4a1fa8;--pi-light:#9b6ef3;--gold:#f5a623;--green:#27ae60;--bg:#0f0c1a;--card:#1a1530;--card2:#221d3a;--text:#f0eaff;--muted:#8a7faa;--border:#2e2650;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);min-height:100vh;font-family:'Inter',sans-serif;}
    body[dir="rtl"]{font-family:'Cairo',sans-serif;}
    .lang-bar{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;background:rgba(108,53,222,0.12);border-bottom:1px solid var(--border);justify-content:center;}
    .lang-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:#ccc;padding:3px 9px;border-radius:20px;cursor:pointer;font-size:0.72rem;transition:.2s;font-family:inherit;}
    .lang-btn:hover,.lang-btn.active{background:var(--pi);border-color:var(--pi);color:#fff;}
    nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;}
    .nav-logo{display:flex;align-items:center;gap:10px;}
    .nav-logo img{width:38px;height:38px;border-radius:10px;}
    .nav-logo-text{font-size:1.15rem;font-weight:900;color:var(--pi-light);}
    .btn-login{background:var(--pi);color:#fff;border:none;padding:7px 16px;border-radius:25px;font-weight:700;cursor:pointer;font-size:.85rem;font-family:inherit;}
    .btn-sell{background:var(--gold);color:#000;border:none;padding:7px 14px;border-radius:25px;font-weight:700;cursor:pointer;font-size:.85rem;font-family:inherit;}
    .hero{background:linear-gradient(135deg,#1a0840,#0f0c1a);padding:32px 16px 20px;text-align:center;}
    .hero h1{font-size:1.8rem;font-weight:900;margin-bottom:8px;}
    .hero h1 span{color:var(--gold);}
    .hero p{color:var(--muted);font-size:.9rem;margin-bottom:18px;}
    .search-bar{display:flex;gap:8px;max-width:500px;margin:0 auto;}
    .search-bar input{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:25px;font-size:.9rem;outline:none;font-family:inherit;}
    .search-bar button{background:var(--pi);color:#fff;border:none;padding:10px 18px;border-radius:25px;font-weight:700;cursor:pointer;font-family:inherit;}
    .stats-bar{display:flex;justify-content:center;gap:24px;padding:16px;flex-wrap:wrap;}
    .stat{text-align:center;}
    .stat-num{font-size:1.3rem;font-weight:900;color:var(--pi-light);}
    .stat-label{font-size:.72rem;color:var(--muted);}
    .section{padding:14px 16px;max-width:1100px;margin:0 auto;}
    .section-title{font-size:1.05rem;font-weight:700;margin-bottom:12px;}
    .cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
    .cat-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font-size:.82rem;font-family:inherit;transition:.2s;}
    .cat-btn.active,.cat-btn:hover{background:var(--pi);border-color:var(--pi);}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
    .prod-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s;}
    .prod-card:hover{border-color:var(--pi-light);transform:translateY(-2px);}
    .prod-img{height:130px;background:linear-gradient(135deg,var(--pi-dark),var(--card2));display:flex;align-items:center;justify-content:center;font-size:2.8rem;position:relative;}
    .prod-badge{position:absolute;top:6px;right:6px;background:var(--gold);color:#000;padding:2px 7px;border-radius:12px;font-size:.68rem;font-weight:700;}
    .prod-info{padding:10px;}
    .prod-name{font-size:.88rem;font-weight:700;margin-bottom:3px;}
    .prod-seller{font-size:.75rem;color:var(--muted);margin-bottom:5px;}
    .prod-price{color:var(--gold);font-weight:900;font-size:.95rem;}
    .buy-btn{width:100%;background:var(--pi);color:#fff;border:none;padding:7px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:7px;font-size:.82rem;font-family:inherit;}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:16px;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--card);border-radius:18px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:20px;}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
    .modal-title{font-size:1.1rem;font-weight:900;}
    .close-btn{background:var(--card2);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;}
    .form-group{margin-bottom:12px;}
    .form-label{font-size:.85rem;color:var(--muted);margin-bottom:5px;display:block;}
    .form-input{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:10px;font-size:.9rem;outline:none;font-family:inherit;}
    .submit-btn{width:100%;background:linear-gradient(135deg,var(--pi),var(--pi-dark));color:#fff;border:none;padding:12px;border-radius:12px;font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit;}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 22px;border-radius:28px;font-weight:700;z-index:999;display:none;}
    @media(max-width:600px){.hero h1{font-size:1.4rem;}.grid{grid-template-columns:repeat(2,1fr);}}
  </style>
</head>
<body>
<div class="lang-bar" id="langBar"></div>
<nav>
  <div class="nav-logo">
    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663669950079/iwknRRPOukQuejaV.png" alt="Keeta Market"/>
    <div class="nav-logo-text">KEETA MARKET</div>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn-sell" onclick="openSell()" id="sellBtn">+ Sell</button>
    <button class="btn-login" id="loginBtn" onclick="loginWithPi()">Login with Pi</button>
  </div>
</nav>
<div class="hero">
  <h1 id="heroTitle">Buy &amp; Sell with <span>Pi</span></h1>
  <p id="heroSub">The global marketplace powered by Pi Network</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search products..."/>
    <button id="searchBtn">Search</button>
  </div>
</div>
<div class="stats-bar">
  <div class="stat"><div class="stat-num">50K+</div><div class="stat-label" id="stat1">Products</div></div>
  <div class="stat"><div class="stat-num">120+</div><div class="stat-label" id="stat2">Countries</div></div>
  <div class="stat"><div class="stat-num">2%</div><div class="stat-label" id="stat3">Commission</div></div>
  <div class="stat"><div class="stat-num">100%</div><div class="stat-label" id="stat4">Pi Payments</div></div>
</div>
<div class="section">
  <div class="section-title" id="catTitle">Categories</div>
  <div class="cats" id="catsRow"></div>
</div>
<div class="section">
  <div class="section-title" id="featTitle">Featured Products</div>
  <div class="grid" id="productsGrid"></div>
</div>
<div class="modal-overlay" id="sellModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="sellTitle">List a Product</div>
      <button class="close-btn" onclick="closeSell()">X</button>
    </div>
    <div class="form-group"><label class="form-label" id="nameLabel">Product Name</label><input class="form-input" id="prodName" placeholder="e.g. Handmade Bag"/></div>
    <div class="form-group"><label class="form-label" id="descLabel">Description</label><textarea class="form-input" id="prodDesc" rows="3"></textarea></div>
    <div class="form-group"><label class="form-label" id="priceLabel">Price (pi)</label><input class="form-input" id="prodPrice" type="number" placeholder="10"/></div>
    <button class="submit-btn" onclick="listProduct()" id="listBtn">List Product for 1pi</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var LANGS={en:{name:'English',flag:'EN',dir:'ltr'},ar:{name:'Arabic',flag:'AR',dir:'rtl'},zh:{name:'Chinese',flag:'ZH',dir:'ltr'},vi:{name:'Viet',flag:'VI',dir:'ltr'},id:{name:'Bahasa',flag:'ID',dir:'ltr'},ko:{name:'Korean',flag:'KO',dir:'ltr'},hi:{name:'Hindi',flag:'HI',dir:'ltr'},es:{name:'Espanol',flag:'ES',dir:'ltr'}};
var LABELS={
  en:{hero:'Buy & Sell with Pi',sub:'The global marketplace powered by Pi Network',search:'Search products...',searchBtn:'Search',login:'Login with Pi',sell:'+ Sell',s1:'Products',s2:'Countries',s3:'Commission',s4:'Pi Payments',cat:'Categories',feat:'Featured Products',sellT:'List a Product',nameL:'Product Name',descL:'Description',priceL:'Price (pi)',listL:'List Product for 1pi',buyNow:'Buy Now'},
  ar:{hero:'اشتري وبع بـ Pi',sub:'السوق العالمي المدعوم بـ Pi Network',search:'ابحث عن منتجات...',searchBtn:'بحث',login:'دخول بـ Pi',sell:'+ بيع',s1:'منتج',s2:'دولة',s3:'عمولة',s4:'مدفوعات Pi',cat:'الفئات',feat:'المنتجات المميزة',sellT:'اضف منتجا',nameL:'اسم المنتج',descL:'الوصف',priceL:'السعر (pi)',listL:'اضف المنتج مقابل 1pi',buyNow:'اشتري الآن'},
  zh:{hero:'用Pi买卖',sub:'由Pi Network驱动的全球市场',search:'搜索商品...',searchBtn:'搜索',login:'使用Pi登录',sell:'+ 出售',s1:'商品',s2:'国家',s3:'佣金',s4:'Pi支付',cat:'分类',feat:'精选商品',sellT:'发布商品',nameL:'商品名称',descL:'描述',priceL:'价格(pi)',listL:'发布商品 1pi',buyNow:'立即购买'},
  vi:{hero:'Mua & Ban voi Pi',sub:'Cho toan cau duoc ho tro boi Pi Network',search:'Tim san pham...',searchBtn:'Tim',login:'Dang nhap Pi',sell:'+ Ban',s1:'San pham',s2:'Quoc gia',s3:'Hoa hong',s4:'Thanh toan Pi',cat:'Danh muc',feat:'San pham noi bat',sellT:'Dang ban',nameL:'Ten san pham',descL:'Mo ta',priceL:'Gia (pi)',listL:'Dang ban 1pi',buyNow:'Mua ngay'},
  id:{hero:'Beli & Jual dengan Pi',sub:'Marketplace global bertenaga Pi Network',search:'Cari produk...',searchBtn:'Cari',login:'Masuk Pi',sell:'+ Jual',s1:'Produk',s2:'Negara',s3:'Komisi',s4:'Pembayaran Pi',cat:'Kategori',feat:'Produk Unggulan',sellT:'Daftarkan Produk',nameL:'Nama Produk',descL:'Deskripsi',priceL:'Harga (pi)',listL:'Daftar Produk 1pi',buyNow:'Beli Sekarang'},
  ko:{hero:'Pi로 사고팔기',sub:'Pi Network으로 구동되는 글로벌 마켓플레이스',search:'상품 검색...',searchBtn:'검색',login:'Pi로 로그인',sell:'+ 판매',s1:'상품',s2:'국가',s3:'수수료',s4:'Pi 결제',cat:'카테고리',feat:'추천 상품',sellT:'상품 등록',nameL:'상품명',descL:'설명',priceL:'가격(pi)',listL:'상품 등록 1pi',buyNow:'지금 구매'},
  hi:{hero:'Pi se Khariden aur Bechen',sub:'Pi Network dwara sanchalit vaishvik bazar',search:'Utpad khojein...',searchBtn:'Khojein',login:'Pi se Login',sell:'+ Bechen',s1:'Utpad',s2:'Desh',s3:'Commission',s4:'Pi Bhugtan',cat:'Shreniyan',feat:'Vishesh Utpad',sellT:'Utpad Suchhibadh Karen',nameL:'Utpad ka Naam',descL:'Vivaran',priceL:'Kimat (pi)',listL:'Utpad 1pi',buyNow:'Abhi Khariden'},
  es:{hero:'Compra y Vende con Pi',sub:'El mercado global impulsado por Pi Network',search:'Buscar productos...',searchBtn:'Buscar',login:'Iniciar sesion Pi',sell:'+ Vender',s1:'Productos',s2:'Paises',s3:'Comision',s4:'Pagos Pi',cat:'Categorias',feat:'Productos Destacados',sellT:'Publicar Producto',nameL:'Nombre del Producto',descL:'Descripcion',priceL:'Precio (pi)',listL:'Publicar 1pi',buyNow:'Comprar Ahora'}
};
var PRODUCTS=[
  {icon:'gem',price:3,rating:'4.9',badge:'New'},
  {icon:'shirt',price:8,rating:'4.7',badge:''},
  {icon:'art',price:15,rating:'5.0',badge:'Top'},
  {icon:'wallet',price:12,rating:'4.8',badge:''},
  {icon:'phone',price:5,rating:'4.6',badge:'Hot'},
  {icon:'mug',price:7,rating:'4.9',badge:''}
];
var PROD_NAMES={
  en:['Handmade Bracelet','Pi T-Shirt','Digital Art','Leather Wallet','Phone Case','Ceramic Mug'],
  ar:['سوار يدوي','تيشيرت Pi','فن رقمي','محفظة جلدية','غطاء هاتف','كوب سيراميك'],
  zh:['手工手链','Pi T恤','数字艺术','皮革钱包','手机壳','陶瓷杯'],
  vi:['Vong tay thu cong','Ao Pi','Nghe thuat so','Vi da','Op dien thoai','Coc gom'],
  id:['Gelang Handmade','Kaos Pi','Seni Digital','Dompet Kulit','Case HP','Mug Keramik'],
  ko:['수제 팔찌','Pi 티셔츠','디지털 아트','가죽 지갑','폰 케이스','도자기 머그'],
  hi:['Hastanirmit Kangan','Pi T-Shirt','Digital Art','Chamde ka Batua','Phone Case','Ceramic Mug'],
  es:['Pulsera Artesanal','Camiseta Pi','Arte Digital','Billetera Cuero','Funda Movil','Taza Ceramica']
};
var ICONS={'gem':'💎','shirt':'👕','art':'🎨','wallet':'👜','phone':'📱','mug':'☕'};
var currentLang=localStorage.getItem('pi_lang')||'en';
function buildLangBar(){
  document.getElementById('langBar').innerHTML=Object.entries(LANGS).map(function(e){
    var code=e[0],l=e[1];
    return '<button class="lang-btn'+(code===currentLang?' active':'')+'" onclick="setLang(\''+code+'\')">'+l.flag+' '+l.name+'</button>';
  }).join('');
}
function setLang(lang){currentLang=lang;localStorage.setItem('pi_lang',lang);document.documentElement.lang=lang;document.documentElement.dir=LANGS[lang].dir;renderAll();}
function renderAll(){
  var lb=LABELS[currentLang]||LABELS.en;
  buildLangBar();
  document.getElementById('heroTitle').textContent=lb.hero;
  document.getElementById('heroSub').textContent=lb.sub;
  document.getElementById('searchInput').placeholder=lb.search;
  document.getElementById('searchBtn').textContent=lb.searchBtn;
  document.getElementById('loginBtn').textContent=lb.login;
  document.getElementById('sellBtn').textContent=lb.sell;
  document.getElementById('stat1').textContent=lb.s1;
  document.getElementById('stat2').textContent=lb.s2;
  document.getElementById('stat3').textContent=lb.s3;
  document.getElementById('stat4').textContent=lb.s4;
  document.getElementById('catTitle').textContent=lb.cat;
  document.getElementById('featTitle').textContent=lb.feat;
  document.getElementById('sellTitle').textContent=lb.sellT;
  document.getElementById('nameLabel').textContent=lb.nameL;
  document.getElementById('descLabel').textContent=lb.descL;
  document.getElementById('priceLabel').textContent=lb.priceL;
  document.getElementById('listBtn').textContent=lb.listL;
  var cats=['All','Electronics','Fashion','Home','Books','Art','Natural','Sports','Gaming'];
  document.getElementById('catsRow').innerHTML=cats.map(function(c,i){return '<button class="cat-btn'+(i===0?' active':'')+'" onclick="this.parentNode.querySelectorAll(\'.cat-btn\').forEach(function(b){b.classList.remove(\'active\')});this.classList.add(\'active\')">'+c+'</button>';}).join('');
  var names=PROD_NAMES[currentLang]||PROD_NAMES.en;
  document.getElementById('productsGrid').innerHTML=PRODUCTS.map(function(p,i){
    return '<div class="prod-card"><div class="prod-img">'+ICONS[p.icon]+(p.badge?'<span class="prod-badge">'+p.badge+'</span>':'')+'</div><div class="prod-info"><div class="prod-name">'+names[i]+'</div><div class="prod-seller">@seller_pi</div><div style="display:flex;justify-content:space-between"><span class="prod-price">'+p.price+' pi</span><span style="font-size:.75rem;color:var(--muted)">'+p.rating+' ★</span></div><button class="buy-btn" onclick="buyProduct(\''+names[i]+'\','+p.price+')">'+lb.buyNow+'</button></div></div>';
  }).join('');
}
function openSell(){document.getElementById('sellModal').classList.add('open');}
function closeSell(){document.getElementById('sellModal').classList.remove('open');}
function listProduct(){
  var name=document.getElementById('prodName').value;
  if(!name){showToast('Enter product name');return;}
  Pi.createPayment({amount:1,memo:'Keeta Market List: '+name,metadata:{app:'keeta-market'}},{
    onReadyForServerApproval:function(id){},
    onReadyForServerCompletion:function(id,txid){showToast('Product listed!');closeSell();},
    onCancel:function(){},onError:function(e){}
  });
}
function buyProduct(name,price){
  Pi.createPayment({amount:price,memo:'Keeta Market Buy: '+name,metadata:{app:'keeta-market'}},{
    onReadyForServerApproval:function(id){},
    onReadyForServerCompletion:function(id,txid){showToast('Purchase complete!');},
    onCancel:function(){},onError:function(e){}
  });
}
function loginWithPi(){Pi.authenticate(['username','payments'],function(){}).then(function(auth){document.getElementById('loginBtn').textContent=auth.user.username;}).catch(function(){});}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},2500);}
try{Pi.init({version:'2.0',sandbox:true});}catch(e){}
renderAll();

// Auto-authenticate on load as required by Pi App Studio
window.addEventListener('load', function(){
  setTimeout(function(){
    try{
      Pi.authenticate(['username','payments'], function(p){ console.log('Incomplete:',p); }).then(function(auth){
        if(auth && auth.user){
          try{ var btn=document.getElementById('loginBtn'); if(btn) btn.textContent=auth.user.username; }catch(e){}
          try{ var un=document.getElementById('userName'); if(un) un.textContent=auth.user.username; }catch(e){}
          try{ var ub=document.getElementById('userBar'); if(ub) ub.classList.add('visible'); }catch(e){}
        }
      }).catch(function(e){ console.log('Auth error:',e); });
    }catch(e){ console.log('Pi SDK error:',e); }
  }, 500);
});

</script>
</body>
</html>
